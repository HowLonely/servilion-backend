services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    env_file:
      - .env.prod
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    command: gunicorn core.asgi:application -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000
    restart: unless-stopped
    volumes:
      - static_volume:/app/staticfiles
    env_file:
      - .env.prod
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; request=urllib.request.Request('http://localhost:8000/api/docs', headers={'X-Forwarded-Proto':'https'}); urllib.request.urlopen(request, timeout=5)"]
      interval: 15s
      timeout: 6s
      retries: 5

  celery_worker:
    build: .
    command: celery -A core worker --loglevel=info
    restart: unless-stopped
    env_file:
      - .env.prod
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy

  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles:ro
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: ../web
      args:
        NEXT_PUBLIC_API_URL: https://${API_DOMAIN}
    restart: unless-stopped
    environment:
      DJANGO_API_URL: http://nginx
      NEXT_PUBLIC_API_URL: https://${API_DOMAIN}
    healthcheck:
      # 127.0.0.1 y no localhost: en la imagen node:*-alpine, localhost
      # resuelve primero a ::1 (IPv6) y Next.js solo escucha en IPv4
      # (HOSTNAME=0.0.0.0), así que con "localhost" el wget siempre falla
      # con connection refused aunque el server esté sirviendo bien.
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:3000/login"]
      interval: 15s
      timeout: 6s
      retries: 5

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file:
      - .env.prod
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - nginx
      - web

volumes:
  postgres_data_prod:
  static_volume:
  caddy_data:
  caddy_config: