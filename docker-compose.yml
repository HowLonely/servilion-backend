services:
  db_servilion:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env
    ports:
      - "5432:5432"

  redis_servilion:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api_servilion:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db_servilion
      - redis_servilion

  celery_worker_servilion:
    build: .
    command: celery -A core worker --loglevel=info
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - db_servilion
      - redis_servilion

volumes:
  postgres_data: