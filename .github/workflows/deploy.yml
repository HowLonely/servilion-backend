name: Deploy to production

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read
  packages: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  # Compilar acá y no en el EC2 de producción: el t3.micro tiene 1GB de RAM
  # compartido entre 7 contenedores y un `docker build` ahí compite por esa
  # misma memoria, al punto de que el kernel mató a gunicorn por OOM durante
  # un deploy (incidente 2026-09-08). El runner de Actions tiene RAM de sobra
  # y es gratis; subimos la imagen a GHCR y el servidor solo la baja.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/howlonely/servilion-backend:latest
            ghcr.io/howlonely/servilion-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::408336117438:role/servilion-github-deploy
          aws-region: us-east-1

      - name: Deploy via SSM
        run: |
          INSTANCE_ID=i-0bc4ab56e312c1464

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["bash /home/ubuntu/servilion/backend/deploy/deploy.sh"]' \
            --query "Command.CommandId" --output text)

          echo "SSM command: $COMMAND_ID"

          STATUS="InProgress"
          for i in $(seq 1 90); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            if [ "$STATUS" != "Pending" ] && [ "$STATUS" != "InProgress" ]; then
              break
            fi
            sleep 5
          done

          echo "--- stdout ---"
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query "StandardOutputContent" --output text
          echo "--- stderr ---"
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query "StandardErrorContent" --output text

          if [ "$STATUS" != "Success" ]; then
            echo "Deploy failed with status: $STATUS"
            exit 1
          fi
