server {
    listen 80;

    # Los contenedores cambian de IP al recrearse. Resolver mediante Docker DNS
    # evita que Nginx conserve la IP anterior y responda 502 hasta reiniciarse.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        set $django_api http://api:8000;
        proxy_pass $django_api;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Nginx sólo es accesible dentro de Docker; Caddy es quien termina TLS.
        # Next también entra por esta red privada para login/refresh.
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Host $host;
        proxy_redirect off;
    }

    location /static/ {
        alias /app/staticfiles/;
    }
}