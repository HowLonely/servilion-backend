upstream django_api {
    server api:8000;
}

server {
    listen 80;

    location / {
        proxy_pass http://django_api;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Nginx sólo es accesible dentro de Docker; Caddy es quien termina TLS.
        # Next también entra por esta red privada para login/refresh.
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Host $host;
        proxy_redirect off;
    }

    location /static/ {
        alias /app/staticfiles/;
    }
}